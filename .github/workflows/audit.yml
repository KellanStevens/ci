name: Audit

# Check bun.lock for known vulnerabilities. This reads only the lockfile, so it
# needs Bun but no install.
#
# Do not make a deploy wait for this job: a new advisory turns it red, but it
# should not stop a deploy.

on:
  workflow_call:
    inputs:
      ignore:
        description: >-
          Advisories to ignore, separated by spaces or new lines, for example
          GHSA-gcqx-w48m-w2h4. Only ignore an advisory that has no fix, and
          say why next to the caller.
        type: string
        default: ""

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The scripts of this repository, at the commit of this workflow.
      - name: Check out shared CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Audit
        env:
          IGNORE: ${{ inputs.ignore }}
        run: .ci/scripts/audit.sh
