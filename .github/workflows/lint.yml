name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actionlint checks the workflows, and runs shellcheck on their run:
      # blocks. The checksum comes from the checksums file of the release.
      # Renovate updates VERSION and SHA256 together (customManagers in
      # renovate.json), so VERSION is the release tag, with its "v".
      - name: Install actionlint
        env:
          VERSION: v1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSLo "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/$VERSION/actionlint_${VERSION#v}_linux_amd64.tar.gz"
          echo "$SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint

      - name: Lint workflows
        if: ${{ !cancelled() }}
        run: '"$RUNNER_TEMP/actionlint" -color'

      # actionlint does not read composite actions, so check their scripts
      # here. The runner image includes shellcheck.
      - name: Lint scripts
        if: ${{ !cancelled() }}
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "No scripts yet."
            exit 0
          fi
          shellcheck --external-sources "${scripts[@]}"

  # actionlint does not load the action.yml files the way the runner does. For
  # example, the runner evaluates ${{ }} even in an input's description. Run
  # the actions that need no Cloudflare token, so that a broken action.yml
  # fails here and not in a site's deploy.
  actions:
    name: actions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Write Worker secrets
        id: secrets
        uses: ./actions/worker-secrets
        with:
          optional: CI_TEST_UNSET
          secrets: "{}"

      - name: Check Worker secrets
        env:
          FILE: ${{ steps.secrets.outputs.file }}
        run: |
          if [ -n "$FILE" ]; then
            echo "::error::Expected no secrets file, got \"$FILE\"."
            exit 1
          fi

      - name: Write the Cloudflare token as a Worker secret
        id: deny
        continue-on-error: true
        uses: ./actions/worker-secrets
        with:
          required: LEAK=CLOUDFLARE_API_TOKEN
          secrets: '{"CLOUDFLARE_API_TOKEN": "not-a-token"}'

      - name: Check the token was refused
        env:
          OUTCOME: ${{ steps.deny.outcome }}
        run: |
          if [ "$OUTCOME" != failure ]; then
            echo "::error::worker-secrets accepted CLOUDFLARE_API_TOKEN as a source."
            exit 1
          fi

      # Fails before any request, so it needs no network.
      - name: Check Access with a bad team name
        id: bad-team
        continue-on-error: true
        uses: ./actions/check-access
        with:
          host: example.invalid
          access-team: Not_A_Team

      - name: Check the team name was refused
        env:
          OUTCOME: ${{ steps.bad-team.outcome }}
          PUBLIC: ${{ steps.bad-team.outputs.public }}
        run: |
          if [ "$OUTCOME" != failure ] || [ -n "$PUBLIC" ]; then
            echo "::error::check-access accepted a bad team name."
            exit 1
          fi
