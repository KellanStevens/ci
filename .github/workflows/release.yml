name: Release

# Tag a commit of main as a release, and draft its GitHub Release with
# generated notes. Run it by hand from the Actions tab, then edit the notes
# and publish the draft.
#
# The tag goes up at once, and Renovate in the sites sees it then, not when
# the draft is published. The protect-release-tags ruleset stops a tag from
# moving or being deleted, so a version that is out is out: fix forward with
# the next one.

on:
  workflow_dispatch:
    inputs:
      version:
        description: The new version, as vX.Y.Z. It must be newer than every tag.
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Create the tag and the draft release.
      contents: write
      # Read the checks of the commit.
      checks: read
    steps:
      # For the scripts only. The tag itself goes through the API.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: scripts/release-check-version.sh

      # A tag cannot be moved, so do not tag a commit that lint.yml has not
      # passed. Keep the names in step with the jobs of lint.yml.
      - name: Check lint passed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REQUIRED: lint actions test
        run: scripts/release-check-lint.sh

      # Through the API, so that the job needs no git credentials. An
      # annotated tag, like the ones made by hand.
      - name: Tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: scripts/release-tag.sh

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: scripts/release-draft.sh
