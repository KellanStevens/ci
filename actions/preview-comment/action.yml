name: Preview comment
description: >-
  Keep one comment with the state of the preview on a pull request: deploying,
  deployed with the link, failed, removed or not deleted. Later pushes and
  later states edit it, so the conversation does not fill with a new comment
  each time. Needs pull-requests: write.

inputs:
  pr-number:
    description: The pull request.
    required: true
  url:
    description: The preview URL.
    required: true
  status:
    description: >-
      The state to show: "deploying" (the preview is not up yet), "deployed",
      "failed", "removed" (the pull request closed and the preview is gone)
      or "delete-failed" (the pull request closed, and the preview could not
      be deleted). "removed" only edits an existing comment and never adds
      one. "delete-failed" adds one if there is none, because the preview may
      still be live.
    default: deployed
  sha:
    description: The commit that the preview was built from.
    required: true
  marker:
    description: >-
      The hidden HTML comment that finds the comment again, without the
      `<!-- -->`. Keep it when you move a site to this action, or the next
      push adds a second comment.
    default: preview
  token:
    description: >-
      A token that can comment on the pull request. With a token other than
      the default, set author too.
    default: ${{ github.token }}
  author:
    description: >-
      The login that the token comments as, for example my-app[bot] for a
      GitHub App, or the user of a personal access token. Only a comment by
      this login is edited, so with the wrong one each push adds a comment.
    default: github-actions[bot]

runs:
  using: composite
  steps:
    - name: Comment preview link
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ inputs.pr-number }}
        URL: ${{ inputs.url }}
        STATUS: ${{ inputs.status }}
        HEAD_SHA: ${{ inputs.sha }}
        MARKER: ${{ inputs.marker }}
        AUTHOR: ${{ inputs.author }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: '"$GITHUB_ACTION_PATH/preview-comment.sh"'
