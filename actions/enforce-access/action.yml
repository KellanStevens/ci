name: Enforce Access
description: >-
  Fail unless Cloudflare Access protects a hostname, and take the site down
  if it does not. A site that answers without a login is detached. For a site
  that cannot be reached, on-unreachable decides. With worker-name, the whole
  preview Worker is deleted. With workers-dev-worker, the workers.dev and
  preview URLs of the Worker, which skip Access, are turned off.

inputs:
  host:
    description: The hostname to check, for example pr-12.example.com.
    required: true
  cloudflare-api-token:
    description: A token with Workers Scripts Edit (and Zone Read without account-id).
    required: true
  worker-name:
    description: >-
      The preview Worker to delete with its domain, for example example-pr-12.
      Leave empty to detach the domain only, as for production.
    default: ""
  workers-dev-worker:
    description: >-
      The Worker whose workers.dev and preview URLs must be off, for example
      example-pr-12 or the name in wrangler.jsonc. Access protects the
      hostname, not these URLs, so a Worker that is on them is public. They
      are turned off and the step fails, until wrangler.jsonc sets
      "workers_dev" and "preview_urls" to false. Leave empty to skip the check,
      with a warning. Needs Workers Scripts Edit.
    default: ""
  on-unreachable:
    description: >-
      What to do if the site cannot be reached, so Access is not proven. "remove"
      takes the site down, "keep" leaves it up. Either way, the step fails.
      "keep" suits production, where a flaky check should not cause an outage.
    default: remove
  account-id:
    description: >-
      The Cloudflare account. Leave empty to find it from the zone of the
      hostname.
    default: ""

runs:
  using: composite
  steps:
    - name: Enforce Access on ${{ inputs.host }}
      shell: bash
      env:
        HOST: ${{ inputs.host }}
        WORKER_NAME: ${{ inputs.worker-name }}
        WORKERS_DEV_WORKER: ${{ inputs.workers-dev-worker }}
        ON_UNREACHABLE: ${{ inputs.on-unreachable }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account-id }}
      run: '"$GITHUB_ACTION_PATH/enforce-access.sh" "$HOST" "$ON_UNREACHABLE" "$WORKER_NAME" "$WORKERS_DEV_WORKER"'
